<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Siswa</title>

    <!-- Menghubungkan HTML dengan CSS -->
    <link rel="stylesheet" href="formbiodata.css">
</head>

<body>

    <div class="container">

        <!-- Judul -->
        <h1>BIODATA SISWA</h1>

        <!-- Form Biodata -->
        <form>

            <div class="form-group">
                <label for="nama">Nama:</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama">
            </div>

            <div class="form-group">
                <label for="alamat">Alamat:</label>
                <textarea id="alamat" name="alamat" placeholder="Masukkan alamat"></textarea>
            </div>

            <div class="form-group">
                <label for="jurusan">Jurusan:</label>
                <input type="text" id="jurusan" name="jurusan" placeholder="Contoh: RPL">
            </div>

            <div class="form-group">
                <label>Jenis Kelamin:</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="jenis_kelamin" value="Laki-laki">
                        Laki-laki
                    </label>

                    <label>
                        <input type="radio" name="jenis_kelamin" value="Perempuan">
                        Perempuan
                    </label>

                    <label>
                        <input type="radio" name="jenis_kelamin" value="Boti">
                        Boti
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="tinggi">Tinggi Badan (cm):</label>
                <input type="number" id="tinggi" name="tinggi" placeholder="Contoh: 165">
            </div>

            <div class="form-group">
                <label for="berat">Berat Badan (kg):</label>
                <input type="number" id="berat" name="berat" placeholder="Contoh: 55">
            </div>

            <div class="form-group">
                <label for="hobi">Hobi:</label>
                <input type="text" id="hobi" name="hobi" placeholder="Contoh: Membaca">
            </div>

            <div class="form-group">
                <label for="nohp">No. HP:</label>
                <input type="number" id="nohp" name="nohp" placeholder="08xxxxxxxxxx">
            </div>

            <button type="submit">Simpan</button>

        </form>
